 <!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የፅዱ ቤተሰብ ወርሃዊ የክትትል መመዝገቢያ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 15px;
            color: #333;
        }
        .main-card {
            max-width: 950px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2, h3 {
            text-align: center;
            color: #1b4d3e;
            margin-bottom: 20px;
        }

        /* Stats Bar & Grid */
        .dashboard-section {
            background-color: #f8f9fa;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .dashboard-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: #1b4d3e;
            margin-bottom: 12px;
            border-bottom: 2px solid #1b4d3e;
            padding-bottom: 5px;
        }
        .stats-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .stat-box {
            flex: 1;
            min-width: 130px;
            padding: 10px;
            border-radius: 6px;
            color: #fff;
            text-align: center;
        }
        .bg-total { background-color: #2c3e50; }
        .bg-present { background-color: #27ae60; }
        .bg-absent { background-color: #c0392b; }
        .bg-permission { background-color: #d35400; }

        .stat-box h5 { margin-bottom: 4px; font-size: 0.85rem; }
        .stat-box p.num { font-size: 1.2rem; font-weight: bold; }
        .stat-box p.sub { font-size: 0.75rem; opacity: 0.9; margin-top: 2px; }

        .member-stats-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .member-stat-card {
            flex: 1;
            min-width: 180px;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
        }
        .member-stat-card h6 {
            color: #2c3e50;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }
        .member-stat-card .val {
            font-size: 1rem;
            font-weight: bold;
            color: #1b4d3e;
        }
        .member-stat-card .sub-val {
            font-size: 0.75rem;
            color: #64748b;
        }

        /* Form Layout */
        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-weight: bold;
            font-size: 0.95rem;
            color: #2c3e50;
        }
        
        .text-input {
            width: 100%;
            height: 42px;
            padding: 8px 12px;
            font-size: 1rem;
            border: 1px solid #cccccc;
            border-radius: 5px;
            outline: none;
        }

        /* Chip Options Layout */
        .radio-options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .radio-options input[type="radio"] {
            display: none;
        }
        .radio-options label {
            padding: 7px 12px;
            font-size: 0.88rem;
            border: 1px solid #bdc3c7;
            border-radius: 18px;
            background-color: #f8f9fa;
            color: #333;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            font-weight: normal;
        }
        .radio-options input[type="radio"]:checked + label {
            background-color: #1b4d3e;
            color: #ffffff;
            border-color: #1b4d3e;
            font-weight: bold;
        }

        /* Attendance Radio Accent Colors */
        .radio-options.attendance-group input[value="ተገኝቷል"]:checked + label {
            background-color: #27ae60; border-color: #27ae60;
        }
        .radio-options.attendance-group input[value="ቀሪ"]:checked + label {
            background-color: #c0392b; border-color: #c0392b;
        }
        .radio-options.attendance-group input[value="ፈቃድ"]:checked + label {
            background-color: #d35400; border-color: #d35400;
        }

        /* Days Grid Style */
        .days-group label {
            min-width: 38px;
            text-align: center;
            padding: 6px 8px;
        }

        /* Buttons */
        .btn-holder {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }
        .btn {
            padding: 12px 22px;
            font-size: 1rem;
            font-weight: bold;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-submit { background-color: #1b4d3e; }
        .btn-export { background-color: #27ae60; }
        .btn-edit { background-color: #f39c12; padding: 5px 10px; font-size: 0.85rem; }
        .btn-delete { background-color: #c0392b; padding: 5px 10px; font-size: 0.85rem; }

        hr {
            margin: 25px 0;
            border: 0;
            border-top: 1px solid #dddddd;
        }

        /* Data Table */
        .table-container {
            overflow-x: auto;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .data-table th, .data-table td {
            padding: 10px;
            border: 1px solid #dddddd;
            text-align: center;
            font-size: 0.85rem;
        }
        .data-table th { background-color: #1b4d3e; color: white; }
        .txt-present { color: #27ae60; font-weight: bold; }
        .txt-absent { color: #c0392b; font-weight: bold; }
        .txt-permission { color: #d35400; font-weight: bold; }
        .signature-col { width: 100px; min-width: 90px; }
    </style>
</head>
<body>

    <div class="main-card">
        <h2>የፅዱ ቤተሰብ ወርሃዊ የክትትል መመዝገቢያ</h2>

        <!-- Enhanced Dashboard Summary -->
        <div class="dashboard-section">
            <div class="dashboard-title">የመገኘት እና የጾታ ስብጥር ማጠቃለያ</div>
            <div class="stats-container">
                <div class="stat-box bg-total">
                    <h5>ጠቅላላ አባላት</h5>
                    <p class="num" id="txtTotal">0</p>
                    <p class="sub" id="txtTotalGender">(ወ: 0 | ሴ: 0)</p>
                </div>
                <div class="stat-box bg-present">
                    <h5>ተገኝቷል</h5>
                    <p class="num" id="txtPresent">0</p>
                    <p class="sub" id="txtPresentGender">(ወ: 0 | ሴ: 0)</p>
                </div>
                <div class="stat-box bg-absent">
                    <h5>ቀሪ</h5>
                    <p class="num" id="txtAbsent">0</p>
                    <p class="sub" id="txtAbsentGender">(ወ: 0 | ሴ: 0)</p>
                </div>
                <div class="stat-box bg-permission">
                    <h5>ፈቃድ</h5>
                    <p class="num" id="txtPermission">0</p>
                    <p class="sub" id="txtPermissionGender">(ወ: 0 | ሴ: 0)</p>
                </div>
            </div>

            <div class="dashboard-title" style="margin-top: 15px;">የአባልነት ሁኔታ ከጾታ ስብጥር ጋር</div>
            <div class="member-stats-grid">
                <div class="member-stat-card">
                    <h6>ሙሉ አባል</h6>
                    <div class="val" id="txtFullMember">0</div>
                    <div class="sub-val" id="txtFullMemberGender">ወ: 0 | ሴ: 0</div>
                </div>
                <div class="member-stat-card">
                    <h6>እጩ አባል</h6>
                    <div class="val" id="txtCandidateMember">0</div>
                    <div class="sub-val" id="txtCandidateMemberGender">ወ: 0 | ሴ: 0</div>
                </div>
                <div class="member-stat-card">
                    <h6>ደጋፊ አባል</h6>
                    <div class="val" id="txtSupportMember">0</div>
                    <div class="sub-val" id="txtSupportMemberGender">ወ: 0 | ሴ: 0</div>
                </div>
            </div>
        </div>

        <form id="attendanceForm">
            <input type="hidden" id="editIndex" value="-1">

            <div class="form-grid">
                <!-- 1. Full Name -->
                <div class="form-group">
                    <label for="fullName">1. ሙሉ ስም</label>
                    <input type="text" id="fullName" class="text-input" placeholder="የአባሉን ሙሉ ስም ያስገቡ" required>
                </div>

                <!-- 2. Title -->
                <div class="form-group">
                    <label>2. ማዕረግ</label>
                    <div class="radio-options">
                        <input type="radio" id="t1" name="title" value="አቶ" required><label for="t1">አቶ</label>
                        <input type="radio" id="t2" name="title" value="ወ/ሮ"><label for="t2">ወ/ሮ</label>
                        <input type="radio" id="t3" name="title" value="ወ/ሪት"><label for="t3">ወ/ሪት</label>
                        <input type="radio" id="t4" name="title" value="ዶ/ር"><label for="t4">ዶ/ር</label>
                        <input type="radio" id="t5" name="title" value="ኢንጂነር"><label for="t5">ኢንጂነር</label>
                        <input type="radio" id="t6" name="title" value="መምህር"><label for="t6">መምህር</label>
                    </div>
                </div>

                <!-- 3. Gender -->
                <div class="form-group">
                    <label>3. ጾታ</label>
                    <div class="radio-options">
                        <input type="radio" id="g1" name="gender" value="ወንድ" required><label for="g1">ወንድ</label>
                        <input type="radio" id="g2" name="gender" value="ሴት"><label for="g2">ሴት</label>
                    </div>
                </div>

                <!-- 4. Membership Status -->
                <div class="form-group">
                    <label>4. የአባልነት ሁኔታ</label>
                    <div class="radio-options">
                        <input type="radio" id="m1" name="membershipStatus" value="ሙሉ አባል" required><label for="m1">ሙሉ አባል</label>
                        <input type="radio" id="m2" name="membershipStatus" value="እጩ አባል"><label for="m2">እጩ አባል</label>
                        <input type="radio" id="m3" name="membershipStatus" value="ደጋፊ አባል"><label for="m3">ደጋፊ አባል</label>
                    </div>
                </div>

                <!-- 5. Role -->
                <div class="form-group">
                    <label>5. የኃላፊነት ሚና</label>
                    <div class="radio-options">
                        <input type="radio" id="r1" name="role" value="አመራር" required><label for="r1">አመራር</label>
                        <input type="radio" id="r2" name="role" value="ተተኪ አመራር"><label for="r2">ተተኪ አመራር</label>
                        <input type="radio" id="r3" name="role" value="ግንባር ቀደም አባል"><label for="r3">ግንባር ቀደም አባል</label>
                        <input type="radio" id="r4" name="role" value="አባል"><label for="r4">አባል</label>
                    </div>
                </div>

                <!-- 6. Year -->
                <div class="form-group">
                    <label for="ethYear">6. ዓመተ ምሕረት</label>
                    <input type="number" id="ethYear" class="text-input" style="max-width: 200px;" value="2018" min="2000" max="2100" required>
                </div>

                <!-- 7. Month Chips -->
                <div class="form-group">
                    <label>7. ወር</label>
                    <div class="radio-options" id="monthContainer">
                        <!-- Dynamically populated -->
                    </div>
                </div>

                <!-- 8. Day Chips -->
                <div class="form-group">
                    <label>8. ቀን</label>
                    <div class="radio-options days-group" id="dayContainer">
                        <!-- Dynamically populated -->
                    </div>
                </div>

                <!-- 9. Presence Status -->
                <div class="form-group">
                    <label>9. የመገኘት ሁኔታ</label>
                    <div class="radio-options attendance-group">
                        <input type="radio" id="a1" name="attendance" value="ተገኝቷል" required><label for="a1">ተገኝቷል</label>
                        <input type="radio" id="a2" name="attendance" value="ቀሪ"><label for="a2">ቀሪ</label>
                        <input type="radio" id="a3" name="attendance" value="ፈቃድ"><label for="a3">ፈቃድ</label>
                    </div>
                </div>

                <div class="btn-holder">
                    <button type="submit" id="saveBtn" class="btn btn-submit">መዝግብ</button>
                    <button type="button" class="btn btn-export" id="exportBtn">ወደ CSV ላክ</button>
                </div>
            </div>
        </form>

        <hr>

        <h3>የተመዘገቡ አባላት ዝርዝር</h3>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ተ.ቁ</th>
                        <th>ማዕረግ</th>
                        <th>ስም</th>
                        <th>ጾታ</th>
                        <th>አባልነት</th>
                        <th>ሚና</th>
                        <th>ቀን</th>
                        <th>ሁኔታ</th>
                        <th class="signature-col">ፊርማ</th>
                        <th>ተግባር</th>
                    </tr>
                </thead>
                <tbody id="recordTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        var listData = [];
        var monthsList = ["መስከረም", "ጥቅምት", "ሕዳር", "ታኅሣሥ", "ጥር", "የካቲት", "መጋቢት", "ሚያዝያ", "ግንቦት", "ሰኔ", "ሐምሌ", "ነሐሴ", "ጳጉሜ"];

        // Init Month Buttons
        function buildMonthChips() {
            var container = document.getElementById('monthContainer');
            container.innerHTML = "";
            for (var i = 0; i < monthsList.length; i++) {
                var m = monthsList[i];
                var id = "m_chip_" + i;
                var checked = (i === 0) ? "checked" : "";
                
                var html = '<input type="radio" id="' + id + '" name="ethMonth" value="' + m + '" ' + checked + ' onchange="onMonthChange()">' +
                           '<label for="' + id + '">' + m + '</label>';
                container.innerHTML += html;
            }
        }

        // Init Day Buttons based on selected month
        function buildDayChips(maxDays) {
            var container = document.getElementById('dayContainer');
            var selectedDay = getRadioValue('ethDay');
            container.innerHTML = "";

            for (var i = 1; i <= maxDays; i++) {
                var id = "d_chip_" + i;
                var checked = "";
                if (selectedDay) {
                    if (parseInt(selectedDay) === i) checked = "checked";
                } else if (i === 1) {
                    checked = "checked";
                }

                var html = '<input type="radio" id="' + id + '" name="ethDay" value="' + i + '" ' + checked + ' required>' +
                           '<label for="' + id + '">' + i + '</label>';
                container.innerHTML += html;
            }
        }

        function onMonthChange() {
            var m = getRadioValue('ethMonth');
            if (m === "ጳጉሜ") {
                buildDayChips(6);
            } else {
                buildDayChips(30);
            }
        }

        function getRadioValue(name) {
            var ele = document.getElementsByName(name);
            for (var i = 0; i < ele.length; i++) {
                if (ele[i].checked) return ele[i].value;
            }
            return "";
        }

        function setRadioValue(name, val) {
            var ele = document.getElementsByName(name);
            for (var i = 0; i < ele.length; i++) {
                if (ele[i].value == val) {
                    ele[i].checked = true;
                } else {
                    ele[i].checked = false;
                }
            }
        }

        function updateStats() {
            var total = listData.length;
            var totalM = 0, totalF = 0;
            var presM = 0, presF = 0;
            var absM = 0, absF = 0;
            var permM = 0, permF = 0;

            var fullM = 0, fullF = 0;
            var candM = 0, candF = 0;
            var suppM = 0, suppF = 0;

            for (var i = 0; i < listData.length; i++) {
                var d = listData[i];
                var isMale = (d.gender === "ወንድ");
                var isFemale = (d.gender === "ሴት");

                if (isMale) totalM++;
                if (isFemale) totalF++;

                // Attendance Status
                if (d.attendance === "ተገኝቷል") {
                    if (isMale) presM++;
                    if (isFemale) presF++;
                } else if (d.attendance === "ቀሪ") {
                    if (isMale) absM++;
                    if (isFemale) absF++;
                } else if (d.attendance === "ፈቃድ") {
                    if (isMale) permM++;
                    if (isFemale) permF++;
                }

                // Membership Status
                if (d.membershipStatus === "ሙሉ አባል") {
                    if (isMale) fullM++;
                    if (isFemale) fullF++;
                } else if (d.membershipStatus === "እጩ አባል") {
                    if (isMale) candM++;
                    if (isFemale) candF++;
                } else if (d.membershipStatus === "ደጋፊ አባል") {
                    if (isMale) suppM++;
                    if (isFemale) suppF++;
                }
            }

            // Attendance Totals
            document.getElementById('txtTotal').textContent = total;
            document.getElementById('txtTotalGender').textContent = "(ወ: " + totalM + " | ሴ: " + totalF + ")";

            document.getElementById('txtPresent').textContent = (presM + presF);
            document.getElementById('txtPresentGender').textContent = "(ወ: " + presM + " | ሴ: " + presF + ")";

            document.getElementById('txtAbsent').textContent = (absM + absF);
            document.getElementById('txtAbsentGender').textContent = "(ወ: " + absM + " | ሴ: " + absF + ")";

            document.getElementById('txtPermission').textContent = (permM + permF);
            document.getElementById('txtPermissionGender').textContent = "(ወ: " + permM + " | ሴ: " + permF + ")";

            // Membership Aggregation
            document.getElementById('txtFullMember').textContent = (fullM + fullF);
            document.getElementById('txtFullMemberGender').textContent = "ወ: " + fullM + " | ሴ: " + fullF;

            document.getElementById('txtCandidateMember').textContent = (candM + candF);
            document.getElementById('txtCandidateMemberGender').textContent = "ወ: " + candM + " | ሴ: " + candF;

            document.getElementById('txtSupportMember').textContent = (suppM + suppF);
            document.getElementById('txtSupportMemberGender').textContent = "ወ: " + suppM + " | ሴ: " + suppF;
        }

        function renderTable() {
            var tbody = document.getElementById('recordTableBody');
            tbody.innerHTML = "";

            for (var i = 0; i < listData.length; i++) {
                var item = listData[i];
                var cssClass = "";
                
                if (item.attendance === "ተገኝቷል") cssClass = "txt-present";
                else if (item.attendance === "ቀሪ") cssClass = "txt-absent";
                else if (item.attendance === "ፈቃድ") cssClass = "txt-permission";

                var tr = document.createElement('tr');
                tr.innerHTML = 
                    '<td>' + (i + 1) + '</td>' +
                    '<td>' + item.title + '</td>' +
                    '<td>' + item.fullName + '</td>' +
                    '<td>' + item.gender + '</td>' +
                    '<td>' + item.membershipStatus + '</td>' +
                    '<td>' + item.role + '</td>' +
                    '<td>' + item.dateStr + '</td>' +
                    '<td class="' + cssClass + '">' + item.attendance + '</td>' +
                    '<td class="signature-col">_________________</td>' +
                    '<td>' +
                        '<button class="btn btn-edit" onclick="editRow(' + i + ')">አርም</button> ' +
                        '<button class="btn btn-delete" onclick="deleteRow(' + i + ')">ሰርዝ</button>' +
                    '</td>';
                tbody.appendChild(tr);
            }

            updateStats();
        }

        function editRow(index) {
            var d = listData[index];
            document.getElementById('fullName').value = d.fullName;
            setRadioValue('title', d.title);
            setRadioValue('gender', d.gender);
            setRadioValue('membershipStatus', d.membershipStatus);
            setRadioValue('role', d.role);
            document.getElementById('ethYear').value = d.ethYear;
            
            setRadioValue('ethMonth', d.ethMonth);
            onMonthChange();
            setRadioValue('ethDay', d.ethDay);

            setRadioValue('attendance', d.attendance);

            document.getElementById('editIndex').value = index;
            document.getElementById('saveBtn').textContent = "አድስ (Update)";
        }

        function deleteRow(index) {
            if (confirm("እርግጠኛ ነዎት ይህ መረጃ ይደለዝ?")) {
                listData.splice(index, 1);
                renderTable();
            }
        }

        document.getElementById('exportBtn').onclick = function() {
            if (listData.length === 0) {
                alert("የሚላክ መረጃ የለም!");
                return;
            }

            var csvText = "\uFEFFተ.ቁ,ማዕረግ,ሙሉ ስም,ጾታ,የአባልነት ሁኔታ,የኃላፊነት ሚና,ቀን,የመገኘት ሁኔታ,ፊርማ\n";
            for (var i = 0; i < listData.length; i++) {
                var o = listData[i];
                csvText += (i + 1) + ',"' + o.title + '","' + o.fullName + '","' + o.gender + '","' + o.membershipStatus + '","' + o.role + '","' + o.dateStr + '","' + o.attendance + '",""\n';
            }

            var blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
            var link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Tsidu_Beteseb_Attendance.csv";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        document.getElementById('attendanceForm').onsubmit = function(e) {
            e.preventDefault();

            var idx = parseInt(document.getElementById('editIndex').value);
            
            var entry = {
                fullName: document.getElementById('fullName').value,
                title: getRadioValue('title'),
                gender: getRadioValue('gender'),
                membershipStatus: getRadioValue('membershipStatus'),
                role: getRadioValue('role'),
                ethYear: document.getElementById('ethYear').value,
                ethMonth: getRadioValue('ethMonth'),
                ethDay: getRadioValue('ethDay'),
                dateStr: getRadioValue('ethMonth') + " " + getRadioValue('ethDay') + "፣ " + document.getElementById('ethYear').value,
                attendance: getRadioValue('attendance')
            };

            if (idx === -1) {
                listData.push(entry);
            } else {
                listData[idx] = entry;
                document.getElementById('editIndex').value = -1;
                document.getElementById('saveBtn').textContent = "መዝግብ";
            }

            document.getElementById('attendanceForm').reset();
            document.getElementById('ethYear').value = "2018";
            buildMonthChips();
            buildDayChips(30);

            renderTable();
        };

        // Initialize UI
        buildMonthChips();
        buildDayChips(30);
    </script>
</body>
</html>
